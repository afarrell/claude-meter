name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  rust:
    name: Rust build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Install Rust toolchain (stable)
        # Pinned to a full commit SHA, not the mutable @stable tag — a mutable
        # ref is a supply-chain risk (and semgrep flags it). The toolchain
        # channel can no longer be inferred from the ref name once pinned, so
        # it is passed explicitly via the `toolchain` input.
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30 # stable
        with:
          toolchain: stable

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test --locked

  semgrep:
    name: Semgrep
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Run semgrep
        run: semgrep scan --config auto --error --quiet .
